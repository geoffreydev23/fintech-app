<!DOCTYPE html>
<html>
<head>
    <title>Fintech App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 📱 PWA -->
    <link rel="manifest" href="/static/manifest.json">

    <!-- 📊 Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        form {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #22c55e;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
        }

        .danger {
            background: red;
            margin-top: 10px;
        }

        .archive-btn {
            background: blue;
            margin-top: 10px;
        }

        .summary, .chart-container, .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 Smart Finance Tracker</h1>

    <!-- 📊 SUMMARY -->
    <div class="summary">
        <p>💰 Income: Ksh {{income}}</p>
        <p>💸 Expenses: Ksh {{expenses}}</p>
        <p>⚖️ Balance: Ksh {{balance}}</p>
    </div>

    <!-- 📊 CHART -->
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <!-- 🤖 AI INSIGHTS -->
    <div class="summary">
        <h3>🤖 AI Insights</h3>
        {% for insight in insights %}
            <p>{{insight}}</p>
        {% endfor %}
    </div>

    <!-- 📝 ADD TRANSACTION -->
    <form method="POST">
        <input name="amount" placeholder="Amount" required>

        <select name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>

        <input name="category" placeholder="Category (optional)">
        <input name="source" placeholder="Source (mpesa, crypto, bank)">
        <input name="description" placeholder="Description">

        <button type="submit">Add Transaction</button>
    </form>

    <!-- 🗑️ CLEAR -->
    <form method="POST" action="/clear">
        <button class="danger">🗑️ Clear All Data</button>
    </form>

    <!-- 📂 ARCHIVE -->
    <a href="/archive">
        <button class="archive-btn">📂 View Archive</button>
    </a>

    <!-- 📋 TRANSACTIONS -->
    <div>
        <h2>Transactions</h2>
        {% for t in transactions %}
            <div class="card">
                <strong>Ksh {{t[2]}}</strong><br>
                {{t[3]}} | {{t[4]}}<br>
                {{t[6]}}
            </div>
        {% endfor %}
    </div>

    <!-- 🤖 CHATBOT -->
    <div class="summary">
        <h3>🤖 AI Assistant</h3>

        <div id="chatBox" style="min-height:100px;"></div>

        <input id="userInput" placeholder="Ask me anything...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<!-- 📊 CHART SCRIPT -->
<script>
    const data = {{ category_data | tojson }};
    const labels = Object.keys(data);
    const values = Object.values(data);

    const ctx = document.getElementById('myChart').getContext('2d');

    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                data: values
            }]
        }
    });
</script>

<!-- 🤖 CHATBOT SCRIPT (THIS IS STEP 3 — AT THE BOTTOM) -->
<script>
function sendMessage() {
    let input = document.getElementById("userInput");
    let message = input.value;

    fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "message=" + encodeURIComponent(message)
    })
    .then(response => response.text())
    .then(data => {
        let chatBox = document.getElementById("chatBox");

        chatBox.innerHTML += "<p><b>You:</b> " + message + "</p>";
        chatBox.innerHTML += "<p><b>AI:</b> " + data + "</p>";

        input.value = "";
    });
}
</script>

<!-- 📱 SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js")
    .then(() => console.log("Service Worker Registered"));
}
</script>

</body>
</html>
