<!DOCTYPE html>
<html>
<head>
<title>Fintech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#0f172a;color:white;font-family:Arial;padding:20px}
.container{max-width:500px;margin:auto}
.summary,.card{background:#1e293b;padding:15px;border-radius:10px;margin-top:10px}
button{background:#22c55e;color:white;padding:10px;border:none;width:100%}
.chat-user{background:#22c55e;padding:8px;border-radius:10px;margin:5px;text-align:right}
.chat-ai{background:#334155;padding:8px;border-radius:10px;margin:5px}
</style>
</head>

<body>
<div class="container">

<h1>💰 Fintech App</h1>

{% if success=="mpesa" %}
<div style="background:green;padding:10px">Payment successful</div>
{% endif %}

<div class="summary">
<p>Income: {{income}}</p>
<p>Expenses: {{expenses}}</p>
<p>Balance: {{balance}}</p>
</div>

<canvas id="myChart"></canvas>

<form method="POST">
<input name="amount" placeholder="Amount">
<select name="type">
<option value="expense">Expense</option>
<option value="income">Income</option>
</select>
<input name="category" placeholder="Category">
<input name="source" placeholder="Source">
<input name="description" placeholder="Description">
<button onclick="showLoading(this)">Add</button>
</form>

<div class="summary">
<h3>M-Pesa</h3>
<form method="POST" action="/mpesa">
<input name="phone" placeholder="07...">
<input name="amount" placeholder="Amount">
<button onclick="showLoading(this)">Deposit</button>
</form>
</div>

<div>
{% for t in transactions %}
<div class="card">Ksh {{t[2]}} | {{t[4]}}</div>
{% endfor %}
</div>

<div class="summary">
<div id="chatBox"></div>
<input id="userInput">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>
function showLoading(btn){btn.innerText="Processing...";btn.disabled=true;}
</script>

<script>
function sendMessage(){
let msg=document.getElementById("userInput").value;
fetch("/chat",{method:"POST",
headers:{"Content-Type":"application/x-www-form-urlencoded"},
body:"message="+msg})
.then(r=>r.text()).then(d=>{
let box=document.getElementById("chatBox");
box.innerHTML+=`<div class="chat-user">${msg}</div>`;
box.innerHTML+=`<div class="chat-ai">${d}</div>`;
});
}
</script>

<script>
const data={{category_data|tojson}};
new Chart(document.getElementById('myChart'),{
type:'pie',
data:{labels:Object.keys(data),datasets:[{data:Object.values(data)}]}
});
</script>

</body>
</html>
