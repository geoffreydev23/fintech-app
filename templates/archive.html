<!DOCTYPE html>
<html>
<head>
    <title>Archive</title>
</head>
<body style="background:#0f172a; color:white; font-family:Arial; padding:20px;">

<h1>📂 Archived Transactions</h1>

<a href="/" style="color:lightgreen;">⬅ Back to Dashboard</a>

{% for t in archived %}
    <div style="background:#1e293b; padding:10px; margin-top:10px; border-radius:10px;">
        Ksh {{t[1]}} - {{t[3]}} ({{t[2]}})
        <br><br>

        <!-- 🔒 SECURE RESTORE FORM -->
        <form method="POST" action="/restore/{{t[0]}}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <button style="background:orange; border:none; padding:6px; border-radius:5px;">
                🔄 Restore
            </button>
        </form>

    </div>
{% endfor %}

</body>
</html>
