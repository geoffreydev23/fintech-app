<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: orange;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
        }

        p {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🔑 Reset Password</h2>

    {% if error %}
        <p style="color:red;">{{error}}</p>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <!-- ✅ OTP ONLY -->
        <input name="otp" placeholder="6-digit OTP" maxlength="6" required>

        <!-- ✅ NEW PASSWORD -->
        <input name="password" type="password" placeholder="New Password" required>

        <button type="submit">Reset Password</button>
    </form>

    <p><a href="/login">Back to Login</a></p>
</div>

</body>
</html>
