{% extends "app_base.html" %}

{% block content %}

<h1 style="margin-bottom:10px;">
    🔒 Change Password
</h1>

<p style="color:#94a3b8; margin-bottom:30px;">
    Update your account password securely.
</p>

<div style="
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    max-width:600px;
">

    <form method="POST" action="/change-password">

        <label>
            Current Password
        </label>

        <input
            type="password"
            name="current_password"
            required
            style="
                width:100%;
                padding:12px;
                margin-top:8px;
                margin-bottom:20px;
                background:#0f172a;
                color:white;
                border:none;
                border-radius:10px;
            "
        >

        <label>
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            required
            minlength="6"
            style="
                width:100%;
                padding:12px;
                margin-top:8px;
                margin-bottom:20px;
                background:#0f172a;
                color:white;
                border:none;
                border-radius:10px;
            "
        >

        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            required
            minlength="6"
            style="
                width:100%;
                padding:12px;
                margin-top:8px;
                margin-bottom:25px;
                background:#0f172a;
                color:white;
                border:none;
                border-radius:10px;
            "
        >

        <button
            type="submit"
            style="
                background:#22c55e;
                color:white;
                border:none;
                padding:12px 20px;
                border-radius:10px;
                cursor:pointer;
                font-weight:bold;
            "
        >
            💾 Update Password
        </button>

        <a
            href="/settings"
            style="
                margin-left:10px;
                color:#94a3b8;
                text-decoration:none;
            "
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
