<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 14px;
            width: 340px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            animation: fadeIn 0.5s ease;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            transition: 0.25s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 5px;
        }

        button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 12px #22c55e;
        }

        button:active {
            transform: scale(0.98);
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        p {
            text-align: center;
            font-size: 14px;
        }

        .switch {
            margin-top: 15px;
        }

        .error {
            background: #ef4444;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .logo {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #22c55e;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="box">
    <div class="logo">💰 Fintech App</div>

    <h2>🔐 Login</h2>
    <p class="subtitle">Access your account securely</p>

    <!-- 🔴 ERROR MESSAGE -->
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <input 
            name="username" 
            placeholder="Enter your username" 
            required
        >

        <input 
            name="password" 
            type="password" 
            placeholder="Enter your password" 
            required
        >

        <button type="submit">Login</button>
    </form>

    <!-- 🔑 RESET PASSWORD LINK -->
    <p class="switch">
        <a href="/request-reset">Forgot Password?</a>
    </p>

    <p>
        Don’t have an account?
        <a href="/register">Register</a>
    </p>
</div>

</body>
</html>
