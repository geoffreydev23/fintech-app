<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        /* 🔝 NAVBAR */
        .navbar {
            background: #020617;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-weight: bold;
            color: #22c55e;
        }

        .logout {
            color: #ef4444;
            text-decoration: none;
            font-weight: bold;
        }

        .logout:hover {
            opacity: 0.8;
        }

        /* 📦 MAIN */
        .container {
            padding: 25px;
            max-width: 900px;
            margin: auto;
        }

        .welcome {
            font-size: 20px;
            margin-bottom: 20px;
        }

        /* 💳 CARD */
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .balance {
            font-size: 28px;
            color: #22c55e;
            margin-top: 10px;
            font-weight: bold;
        }

        /* ⚡ ACTIONS */
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* ✅ FORM STYLING */
        .actions form {
            flex: 1;
            min-width: 250px;
        }

        .actions input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .actions input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 5px #22c55e;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .deposit {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }

        .withdraw {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        /* 📊 INFO */
        .info {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        /* 📱 MOBILE */
        @media(max-width: 768px) {
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<!-- 🔝 NAVBAR -->
<div class="navbar">
    <div class="logo">💰 Fintech App</div>
    <a href="/logout" class="logout">Logout</a>
</div>

<!-- 📦 MAIN CONTENT -->
<div class="container">

    <div class="welcome">
        Welcome back, <b>{{ username }}</b> 👋
    </div>

    <!-- 💳 BALANCE CARD -->
    <div class="card">

        <div class="info">Account Balance</div>

        <div class="balance">
            KES {{ "%.2f"|format(balance) }}
        </div>

        <div class="actions">

            <!-- 💰 DEPOSIT -->
            <form method="POST" action="/deposit">

                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                <input
                    type="number"
                    step="0.01"
                    min="1"
                    name="amount"
                    placeholder="Enter deposit amount"
                    required
                >

                <button type="submit" class="btn deposit">
                    Deposit
                </button>

            </form>

            <!-- 💸 WITHDRAW -->
            <form method="POST" action="/withdraw">

                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                <input
                    type="number"
                    step="0.01"
                    min="1"
                    name="amount"
                    placeholder="Enter withdrawal amount"
                    required
                >

                <button type="submit" class="btn withdraw">
                    Withdraw
                </button>

            </form>

        </div>

    </div>

    <!-- 📧 USER INFO -->
    <div class="card">

        <div class="info">Account Info</div>

        <p>📧 {{ email }}</p>

    </div>

</div>

</body>
</html>
